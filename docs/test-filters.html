<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrD Filtry - Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .info { background-color: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <h1>DrD Filtry - Test</h1>
    <div id="results"></div>

    <script>
        async function testFilters() {
            const results = document.getElementById('results');
            
            function addResult(message, type = 'info') {
                const div = document.createElement('div');
                div.className = `test-result ${type}`;
                div.textContent = message;
                results.appendChild(div);
            }
            
            addResult('Začínám test filtrů...', 'info');
            
            // Test different table types
            const testTables = [
                { name: 'jmena', expectedFilters: ['gender', 'race', 'class'] },
                { name: 'domy', expectedFilters: ['dum', 'hospoda', 'obchod', 'nevestinec', 'gender'] },
                { name: 'hory', expectedFilters: ['gender'] },
                { name: 'prijmeni', expectedFilters: ['race'] }
            ];
            
            for (const table of testTables) {
                try {
                    const response = await fetch(`DrD-Jmena/drd_table_${table.name}.json`);
                    if (!response.ok) {
                        addResult(`❌ Nepodařilo se načíst ${table.name}.json (${response.status})`, 'error');
                        continue;
                    }
                    
                    const data = await response.json();
                    
                    // Check if filters exist
                    if (!data.filters) {
                        addResult(`❌ ${table.name}: Chybí filters objekt`, 'error');
                        continue;
                    }
                    
                    // Check expected filters
                    const actualFilters = Object.keys(data.filters);
                    const missingFilters = table.expectedFilters.filter(f => !actualFilters.includes(f));
                    const extraFilters = actualFilters.filter(f => !table.expectedFilters.includes(f));
                    
                    if (missingFilters.length === 0 && extraFilters.length === 0) {
                        addResult(`✅ ${table.name}: Všechny filtry v pořádku (${actualFilters.join(', ')})`, 'success');
                    } else {
                        let message = `⚠️ ${table.name}: `;
                        if (missingFilters.length > 0) {
                            message += `Chybí: ${missingFilters.join(', ')}. `;
                        }
                        if (extraFilters.length > 0) {
                            message += `Navíc: ${extraFilters.join(', ')}.`;
                        }
                        addResult(message, 'error');
                    }
                    
                    // Check filter structure
                    for (const [filterKey, filterConfig] of Object.entries(data.filters)) {
                        if (!filterConfig.field || !filterConfig.label || !filterConfig.options) {
                            addResult(`❌ ${table.name}.${filterKey}: Nesprávná struktura filtru`, 'error');
                        } else if (filterConfig.options.length === 0) {
                            addResult(`⚠️ ${table.name}.${filterKey}: Filtr nemá žádné možnosti`, 'error');
                        } else {
                            // Check if Czech labels exist
                            const hasValidLabels = filterConfig.options.every(opt => opt.label && opt.value);
                            if (hasValidLabels) {
                                addResult(`✅ ${table.name}.${filterKey}: Struktura OK (${filterConfig.options.length} možností)`, 'success');
                            } else {
                                addResult(`❌ ${table.name}.${filterKey}: Nesprávná struktura možností`, 'error');
                            }
                        }
                    }
                    
                    // Check displayField
                    if (!data.displayField) {
                        addResult(`⚠️ ${table.name}: Chybí displayField`, 'error');
                    } else {
                        addResult(`✅ ${table.name}: displayField = '${data.displayField}'`, 'success');
                    }
                    
                    // Check data
                    if (!data.data || data.data.length === 0) {
                        addResult(`❌ ${table.name}: Chybí data`, 'error');
                    } else {
                        addResult(`✅ ${table.name}: ${data.data.length} záznamů`, 'success');
                    }
                    
                } catch (error) {
                    addResult(`❌ ${table.name}: Chyba při načítání - ${error.message}`, 'error');
                }
                
                addResult('---', 'info');
            }
            
            addResult('Test dokončen!', 'info');
        }
        
        // Start test when page loads
        document.addEventListener('DOMContentLoaded', testFilters);
    </script>
</body>
</html>
