<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrD Generátor Náhodných Položek</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            padding: 30px;
            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 40px;
            font-size: 1.1em;
        }

        .generator-section {
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 10px;
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }

        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            background: white;
            transition: border-color 0.3s ease;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .btn:active {
            transform: translateY(0);
        }

        .result {
            margin-top: 30px;
            padding: 25px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 10px;
            color: white;
            text-align: left;
            min-height: 100px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .result-content {
            font-size: 1.2em;
            font-weight: 600;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }

        .result-item {
            margin-bottom: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            border-left: 4px solid rgba(255, 255, 255, 0.5);
        }

        .result-item:last-child {
            margin-bottom: 0;
        }

        .filters-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
        }

        .filter-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .filter-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        @media (max-width: 600px) {
            .filter-row {
                flex-direction: column;
                gap: 0;
            }
            
            .filter-row .form-group {
                margin-bottom: 15px;
            }
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            font-style: italic;
        }

        .error {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            padding: 15px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 8px;
        }

        .stat {
            text-align: center;
        }

        .stat-number {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.9em;
            color: #7f8c8d;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            color: #7f8c8d;
            font-size: 0.9em;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
                margin: 10px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .stats {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎲 DrD Generátor</h1>
        <p class="subtitle">Náhodný generátor položek z databáze Dračí hlídky</p>
        
        <div class="generator-section">
            <div class="form-group">
                <label for="tableSelect">Vyberte kategorii:</label>
                <select id="tableSelect" onchange="updateFilters()">
                    <option value="">-- Vyberte kategorii --</option>
                    <option value="mesta">🏰 Města</option>
                    <option value="jmena">👤 Jména</option>
                    <option value="prijmeni">👥 Příjmení</option>
                    <option value="zeme">🌍 Země</option>
                    <option value="hory">🏔️ Hory</option>
                    <option value="reky">🌊 Řeky</option>
                    <option value="jezera">🏞️ Jezera</option>
                    <option value="lesy">🌲 Lesy</option>
                    <option value="hrady">🏯 Hrady</option>
                    <option value="ulice">🛤️ Ulice</option>
                    <option value="ostrovy">🏝️ Ostrovy</option>
                    <option value="pouste">🏜️ Pouště</option>
                    <option value="udoli">⛰️ Údolí</option>
                    <option value="jeskyne">🕳️ Jeskyně</option>
                    <option value="lode">⛵ Lodě</option>
                    <option value="baziny">🐸 Bažiny</option>
                    <option value="brody">🌉 Brody</option>
                    <option value="domy">🏠 Domy</option>
                    <option value="ledovce">🧊 Ledovce</option>
                    <option value="more">🌊 Moře</option>
                    <option value="mysy">🗻 Mysy</option>
                    <option value="pohori">🏔️ Pohoří</option>
                    <option value="prusmyky">🛤️ Průsmyky</option>
                    <option value="rokle">⛰️ Rokle</option>
                    <option value="soutesky">🗻 Soutěsky</option>
                    <option value="stepi">🌾 Stepi</option>
                    <option value="utesy">🗿 Útesy</option>
                    <option value="zatoky">🏖️ Zátoky</option>
                </select>
            </div>

            <!-- Filters section -->
            <div id="filtersSection" class="filters-section" style="display: none;">
                <!-- Gender filter for most tables -->
                <div class="form-group" id="genderFilter" style="display: none;">
                    <label for="genderSelect">Rod:</label>
                    <select id="genderSelect">
                        <option value="">-- Jakýkoliv --</option>
                        <option value="M">Mužský</option>
                        <option value="F">Ženský</option>
                        <option value="N">Střední</option>
                    </select>
                </div>

                <!-- Filters specific to names table -->
                <div id="nameFilters" style="display: none;">
                    <div class="filter-row">
                        <div class="form-group">
                            <label for="raceSelect">Rasa:</label>
                            <select id="raceSelect">
                                <option value="">-- Jakákoliv --</option>
                                <option value="clovek">Člověk</option>
                                <option value="elf">Elf</option>
                                <option value="trpaslik">Trpaslík</option>
                                <option value="hobit">Hobit</option>
                                <option value="kuduk">Kuduk</option>
                                <option value="kroll">Kroll</option>
                                <option value="barbar">Barbar</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="classSelect">Povolání:</label>
                            <select id="classSelect">
                                <option value="">-- Jakékoliv --</option>
                                <option value="valecnik">Válečník</option>
                                <option value="hranicar">Hraničář</option>
                                <option value="alchymista">Alchymista</option>
                                <option value="kouzelnik">Kouzelník</option>
                                <option value="zlodej">Zloděj</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="countSelect">Počet položek:</label>
                <select id="countSelect">
                    <option value="1">1 položka</option>
                    <option value="3">3 položky</option>
                    <option value="5">5 položek</option>
                    <option value="10">10 položek</option>
                    <option value="20">20 položek</option>
                </select>
            </div>
            
            <button class="btn" onclick="generateRandom()">🎲 Generovat náhodné položky</button>
            
            <div class="loading" id="loading">
                Načítám data...
            </div>
        </div>

        <div class="result" id="result" style="display: none;">
            <div class="result-content" id="resultContent">
                Vyberte kategorii a stiskněte tlačítko pro generování
            </div>
        </div>

        <div class="stats" id="stats" style="display: none;">
            <div class="stat">
                <div class="stat-number" id="totalEntries">0</div>
                <div class="stat-label">Celkem položek</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="filteredEntries">0</div>
                <div class="stat-label">Po filtrování</div>
            </div>
        </div>

        <div class="footer">
            <p>🐉 Dračí hlídka • Databáze pro D&D • GitHub Pages</p>
        </div>
    </div>

    <script>
        let currentData = null;
        const baseUrl = 'DrD-Jmena/drd_table_';

        // Table configurations for filters
        const tableConfigs = {
            jmena: {
                hasGender: true,
                genderField: 'pohlavi',
                hasRace: true,
                hasClass: true,
                displayField: 'jmeno'
            },
            mesta: {
                hasGender: true,
                genderField: 'rod',
                displayField: 'nazev'
            },
            ulice: {
                hasGender: true,
                genderField: 'rod',
                displayField: 'nazev'
            },
            hory: {
                hasGender: true,
                genderField: 'rod',
                displayField: 'nazev'
            },
            reky: {
                hasGender: true,
                genderField: 'rod',
                displayField: 'nazev'
            },
            // Add more tables with gender field
            jezera: { hasGender: true, genderField: 'rod', displayField: 'nazev' },
            lesy: { hasGender: true, genderField: 'rod', displayField: 'nazev' },
            hrady: { hasGender: true, genderField: 'rod', displayField: 'nazev' },
            ostrovy: { hasGender: true, genderField: 'rod', displayField: 'nazev' },
            pouste: { hasGender: true, genderField: 'rod', displayField: 'nazev' },
            udoli: { hasGender: true, genderField: 'rod', displayField: 'nazev' },
            jeskyne: { hasGender: true, genderField: 'rod', displayField: 'nazev' },
            lode: { hasGender: true, genderField: 'rod', displayField: 'nazev' },
            baziny: { hasGender: true, genderField: 'rod', displayField: 'nazev' },
            brody: { hasGender: true, genderField: 'rod', displayField: 'nazev' },
            domy: { hasGender: true, genderField: 'rod', displayField: 'nazev' },
            ledovce: { hasGender: true, genderField: 'rod', displayField: 'nazev' },
            more: { hasGender: true, genderField: 'rod', displayField: 'nazev' },
            mysy: { hasGender: true, genderField: 'rod', displayField: 'nazev' },
            pohori: { hasGender: true, genderField: 'rod', displayField: 'nazev' },
            prusmyky: { hasGender: true, genderField: 'rod', displayField: 'nazev' },
            rokle: { hasGender: true, genderField: 'rod', displayField: 'nazev' },
            soutesky: { hasGender: true, genderField: 'rod', displayField: 'nazev' },
            stepi: { hasGender: true, genderField: 'rod', displayField: 'nazev' },
            utesy: { hasGender: true, genderField: 'rod', displayField: 'nazev' },
            zatoky: { hasGender: true, genderField: 'rod', displayField: 'nazev' },
            zeme: { hasGender: true, genderField: 'rod', displayField: 'nazev' },
            prijmeni: { hasGender: true, genderField: 'rod', displayField: 'nazev' }
        };

        function updateFilters() {
            const selectedTable = document.getElementById('tableSelect').value;
            const filtersSection = document.getElementById('filtersSection');
            const genderFilter = document.getElementById('genderFilter');
            const nameFilters = document.getElementById('nameFilters');
            
            // Hide all filters first
            filtersSection.style.display = 'none';
            genderFilter.style.display = 'none';
            nameFilters.style.display = 'none';
            
            if (!selectedTable) return;
            
            const config = tableConfigs[selectedTable];
            if (!config) return;
            
            filtersSection.style.display = 'block';
            
            // Show gender filter if table supports it
            if (config.hasGender) {
                genderFilter.style.display = 'block';
            }
            
            // Show name-specific filters for jmena table
            if (selectedTable === 'jmena') {
                nameFilters.style.display = 'block';
            }
            
            // Reset filter values
            document.getElementById('genderSelect').value = '';
            document.getElementById('raceSelect').value = '';
            document.getElementById('classSelect').value = '';
            
            // Clear current data to force reload
            currentData = null;
        }

        async function loadTableData(tableName) {
            try {
                document.getElementById('loading').style.display = 'block';
                
                const response = await fetch(`${baseUrl}${tableName}.json`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                document.getElementById('loading').style.display = 'none';
                
                return data.data || data;
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                console.error('Error loading data:', error);
                throw error;
            }
        }

        function applyFilters(data, tableName) {
            const config = tableConfigs[tableName];
            if (!config) return data;
            
            let filtered = [...data];
            
            // Apply gender filter
            if (config.hasGender) {
                const genderValue = document.getElementById('genderSelect').value;
                if (genderValue) {
                    filtered = filtered.filter(item => item[config.genderField] === genderValue);
                }
            }
            
            // Apply name-specific filters
            if (tableName === 'jmena') {
                const raceValue = document.getElementById('raceSelect').value;
                const classValue = document.getElementById('classSelect').value;
                
                if (raceValue) {
                    filtered = filtered.filter(item => item[raceValue] === '1');
                }
                
                if (classValue) {
                    filtered = filtered.filter(item => item[classValue] === '1');
                }
            }
            
            return filtered;
        }

        function formatResult(item, tableName) {
            const config = tableConfigs[tableName] || {};
            let resultText = '';
            
            if (tableName === 'jmena') {
                resultText = item.jmeno || 'Neznámé jméno';
                if (item.pohlavi) {
                    const gender = item.pohlavi === 'M' ? '♂️' : item.pohlavi === 'F' ? '♀️' : '';
                    resultText += ` ${gender}`;
                }
            } else {
                // For other items, try common field names
                resultText = item.nazev || item.name || item.jmeno || 
                            item.pad1 || Object.values(item)[0] || 'Neznámá položka';
            }
            
            return resultText;
        }

        async function generateRandom() {
            const select = document.getElementById('tableSelect');
            const selectedTable = select.value;
            const countSelect = document.getElementById('countSelect');
            const count = parseInt(countSelect.value) || 1;
            
            if (!selectedTable) {
                showResult(['Prosím vyberte kategorii!'], 'error');
                return;
            }

            try {
                // Load data if not already loaded or if different table
                if (!currentData || currentData.tableName !== selectedTable) {
                    currentData = {
                        tableName: selectedTable,
                        data: await loadTableData(selectedTable)
                    };
                }

                // Apply filters
                const filteredData = applyFilters(currentData.data, selectedTable);
                
                // Update stats
                document.getElementById('totalEntries').textContent = 
                    currentData.data.length.toLocaleString('cs-CZ');
                document.getElementById('filteredEntries').textContent = 
                    filteredData.length.toLocaleString('cs-CZ');
                document.getElementById('stats').style.display = 'flex';

                // Generate random items
                if (filteredData.length === 0) {
                    showResult(['Žádné položky nevyhovují zadaným filtrům!'], 'error');
                    return;
                }

                const results = [];
                const usedIndices = new Set();
                
                for (let i = 0; i < count && i < filteredData.length; i++) {
                    let randomIndex;
                    do {
                        randomIndex = Math.floor(Math.random() * filteredData.length);
                    } while (usedIndices.has(randomIndex) && usedIndices.size < filteredData.length);
                    
                    usedIndices.add(randomIndex);
                    const randomItem = filteredData[randomIndex];
                    const resultText = formatResult(randomItem, selectedTable);
                    results.push(resultText);
                }
                
                showResult(results, 'success');

            } catch (error) {
                showResult([`Chyba při načítání dat: ${error.message}`], 'error');
            }
        }

        function showResult(results, type = 'success') {
            const resultDiv = document.getElementById('result');
            const resultContent = document.getElementById('resultContent');
            
            if (Array.isArray(results)) {
                if (results.length === 1) {
                    resultContent.innerHTML = results[0];
                } else {
                    resultContent.innerHTML = results.map((result, index) => 
                        `<div class="result-item">${index + 1}. ${result}</div>`
                    ).join('');
                }
            } else {
                resultContent.innerHTML = results;
            }
            
            resultDiv.className = `result ${type}`;
            resultDiv.style.display = 'block';
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            // Add keyboard shortcut
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    generateRandom();
                }
            });
        });
    </script>
</body>
</html>
